# Borealis の CI: 構文の検査、テスト（MPI での分担を含む）、レポートの検証ケース
#
# 手元で同じことをするには:
#   python3 -m compileall -q src src_helper src_interface
#   python3 -m pytest -q tests
#   python3 report/run_verification.py
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/requirements-ci.txt

      - name: Check syntax
        run: python -m compileall -q src src_helper src_interface

      - name: Run tests
        env:
          # GitHub のランナーはコア数が少ないので、MPI のテストでは足りないコアへの割り当てを許す
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: python -m pytest -q tests

      - name: Run verification cases of the report
        run: python report/run_verification.py
